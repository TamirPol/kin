<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kin Sketch Pitch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --paper:#fbf7ee; --ink:#23262d; --frame:#d8d0bf; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--frame); }
  #stage { position:absolute; left:50%; top:50%; width:1920px; height:1080px; transform-origin:50% 50%;
           overflow:hidden; background-color:var(--paper); box-shadow:0 10px 40px rgba(60,40,10,.25); }
  #svg { position:absolute; left:0; top:0; width:1920px; height:1080px; }
  #vignette { position:absolute; inset:0; pointer-events:none;
              background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 58%, rgba(90,65,20,.15) 100%); }
  #caption { position:absolute; left:50%; bottom:40px; transform:translateX(-50%); max-width:1560px; width:max-content;
             padding:12px 34px 16px; border-radius:20px; background:rgba(35,38,45,.88); color:#fff;
             font:400 40px/1.28 Kalam, cursive; text-align:center; opacity:0; transition:opacity .35s; pointer-events:none; }
  #caption.on { opacity:1; }
  body.nocaps #caption { display:none; }
  #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
             font:700 64px Caveat, cursive; color:#999; }
  #ui { position:fixed; left:0; right:0; bottom:0; padding:8px 16px 10px; font:13px/1.3 system-ui, sans-serif;
        color:#3a3a3a; background:linear-gradient(transparent, rgba(255,255,255,.75) 40%); transition:opacity .3s; }
  #bar { height:4px; background:rgba(0,0,0,.12); border-radius:2px; margin-bottom:8px; overflow:hidden; }
  #prog { display:block; height:100%; width:0; background:#2f6fde; }
  #row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  #ui button { font:600 13px system-ui, sans-serif; border:1px solid rgba(0,0,0,.2); background:#fff; border-radius:8px;
               padding:4px 9px; cursor:pointer; color:#333; }
  #ui button.cur { background:#2f6fde; color:#fff; border-color:#2f6fde; }
  #tc { font-variant-numeric:tabular-nums; min-width:92px; }
  .keys { opacity:.75; }
  body.record #ui { display:none; }
  body.record, body.record * { cursor:none !important; }
</style>
</head>
<body>
<div id="stage">
  <svg id="svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
    <defs id="defs">
      <filter id="penShadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    </defs>
    <path id="meas" d="M0 0" style="visibility:hidden"/>
    <g id="world"></g>
    <rect id="flash" x="0" y="0" width="1920" height="1080" fill="#e0413a" opacity="0" pointer-events="none"/>
    <g id="pen" pointer-events="none"></g>
  </svg>
  <div id="vignette"></div>
  <div id="caption"></div>
  <div id="loading">sharpening the markers…</div>
</div>
<div id="ui">
  <div id="bar"><i id="prog"></i></div>
  <div id="row">
    <button id="play" title="pause / play (p)">pause</button>
    <span id="dots"></span>
    <span id="tc">0:00</span>
    <span class="keys">← → or space: scene · 1–9, 0: jump · p: pause · c: captions · r: record mode · f: fullscreen · Home: restart</span>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   Kin: hand-drawn whiteboard pitch. Everything is computed from
   (scene, time), so seeking, stepping and pausing are exact.
   ============================================================ */
const W = 1920, H = 1080, NS = 'http://www.w3.org/2000/svg';
const INK = '#23262d', BLUE = '#2f6fde', RED = '#e0413a', GREEN = '#2f9e5b', ORANGE = '#f08a24',
      YEL = '#ffd23f', GREY = '#8d8d8d', SKIN = '#f7d9bb', LBLUE = '#e3edff', BROWN = '#8a5a3c',
      SAGE = '#b3cdae', CORAL = '#f4aaa2', CREAM = '#fffdf6', DARK = '#3b4150';

const $ = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
};
let seed = 20261114;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const backOut = t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
let uid = 0;
const DRAW = .66;  // global drawing speed: lower = faster pen

const svg = document.getElementById('svg'), defs = document.getElementById('defs'),
      world = document.getElementById('world'), meas = document.getElementById('meas'),
      flash = document.getElementById('flash'), penG = document.getElementById('pen'),
      stage = document.getElementById('stage'), capEl = document.getElementById('caption');

/* ---------- shape helpers (return path strings) ---------- */
const R = (x, y, w, h, r = 14) =>
  `M${x + r} ${y}H${x + w - r}Q${x + w} ${y} ${x + w} ${y + r}V${y + h - r}Q${x + w} ${y + h} ${x + w - r} ${y + h}` +
  `H${x + r}Q${x} ${y + h} ${x} ${y + h - r}V${y + r}Q${x} ${y} ${x + r} ${y}Z`;
const E = (cx, cy, rx, ry = rx) =>
  `M${cx - rx} ${cy}A${rx} ${ry} 0 1 1 ${cx + rx} ${cy}A${rx} ${ry} 0 1 1 ${cx - rx} ${cy}Z`;
const L = (...p) => { let d = ''; for (let i = 0; i < p.length; i += 2) d += (i ? 'L' : 'M') + p[i] + ' ' + p[i + 1]; return d; };
const HEART = (cx, cy, r) =>
  `M${cx} ${cy + r * .9}C${cx - r * 1.7} ${cy - r * .1} ${cx - r * .8} ${cy - r * 1.4} ${cx} ${cy - r * .45}` +
  `C${cx + r * .8} ${cy - r * 1.4} ${cx + r * 1.7} ${cy - r * .1} ${cx} ${cy + r * .9}Z`;

function bubble(x, y, w, h, tx, ty, r = 26) {
  const bw = 30;
  if (ty > y + h) {                       // tail from the bottom edge
    const bx = clamp(tx, x + r + bw, x + w - r - bw);
    return `M${x + r} ${y}H${x + w - r}Q${x + w} ${y} ${x + w} ${y + r}V${y + h - r}Q${x + w} ${y + h} ${x + w - r} ${y + h}` +
      `H${bx + bw / 2}L${tx} ${ty}L${bx - bw / 2} ${y + h}H${x + r}Q${x} ${y + h} ${x} ${y + h - r}V${y + r}Q${x} ${y} ${x + r} ${y}Z`;
  }
  if (tx < x) {                           // tail from the left edge
    const by = clamp(ty, y + r + bw / 2, y + h - r - bw / 2);
    return `M${x + r} ${y}H${x + w - r}Q${x + w} ${y} ${x + w} ${y + r}V${y + h - r}Q${x + w} ${y + h} ${x + w - r} ${y + h}` +
      `H${x + r}Q${x} ${y + h} ${x} ${y + h - r}V${by + bw / 2}L${tx} ${ty}L${x} ${by - bw / 2}V${y + r}Q${x} ${y} ${x + r} ${y}Z`;
  }
  const by = clamp(ty, y + r + bw / 2, y + h - r - bw / 2);   // tail from the right edge
  return `M${x + r} ${y}H${x + w - r}Q${x + w} ${y} ${x + w} ${y + r}V${by - bw / 2}L${tx} ${ty}L${x + w} ${by + bw / 2}` +
    `V${y + h - r}Q${x + w} ${y + h} ${x + w - r} ${y + h}H${x + r}Q${x} ${y + h} ${x} ${y + h - r}V${y + r}Q${x} ${y} ${x + r} ${y}Z`;
}
function cloud(cx, cy, w, h, n = 11) {
  const pts = [];
  for (let i = 0; i < n; i++) { const a = Math.PI + i / n * Math.PI * 2; pts.push([cx + Math.cos(a) * w / 2, cy + Math.sin(a) * h / 2]); }
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < n; i++) {
    const a = pts[i], b = pts[(i + 1) % n], br = Math.hypot(b[0] - a[0], b[1] - a[1]) * .62;
    d += `A${br.toFixed(1)} ${br.toFixed(1)} 0 0 1 ${b[0].toFixed(1)} ${b[1].toFixed(1)}`;
  }
  return d + 'Z';
}

/* ---------- sketchify: resample a path and add a gentle hand wobble ---------- */
function sketchOne(d, amp) {
  meas.setAttribute('d', d);
  const len = meas.getTotalLength();
  if (len < 3) return d;
  const closed = /Z\s*$/i.test(d);
  const step = 6, n = Math.max(3, Math.ceil(len / step));
  const f1 = 1 / (35 + rnd() * 45), f2 = 1 / (90 + rnd() * 90), p1 = rnd() * 6.283, p2 = rnd() * 6.283;
  const extra = closed ? Math.min(22, len * .07) : 0;
  const total = n + Math.ceil(extra / (len / n));
  const pts = [];
  for (let i = 0; i <= total; i++) {
    const s = i * len / n, sm = s > len ? s - len : s;
    const a = meas.getPointAtLength(sm), b = meas.getPointAtLength(Math.min(len, sm + 1)), c = meas.getPointAtLength(Math.max(0, sm - 1));
    let tx = b.x - c.x, ty = b.y - c.y; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
    let o = amp * (Math.sin(s * f1 * 6.283 + p1) * .65 + Math.sin(s * f2 * 6.283 + p2) * .35);
    if (s > len) o += (s - len) * .28;              // closed shapes overshoot their start, like a real marker
    if (!closed) o *= Math.min(1, s / 25, (len - s) / 25 + .25);
    pts.push((a.x - ty * o).toFixed(1) + ' ' + (a.y + tx * o).toFixed(1));
  }
  return 'M' + pts.join('L');
}
const sketch = (d, amp = 1.6) => d.split(/(?=M)/).filter(x => x.trim()).map(p => sketchOne(p, amp)).join('');

/* ---------- the builder: scene authors call these in drawing order ---------- */
class Builder {
  constructor(root) {
    this.t = 0; this.items = []; this.caps = []; this.loops = []; this.instant = false;
    this.back = $('g', {}, root); this.main = $('g', {}, root);
  }
  wait(d) { this.t += d; return this; }
  at(t) { this.t = t; return this; }
  cap(text) { this.caps.push({ t: this.t, text }); }
  add(it, o = {}) {
    it.t0 = o.at != null ? o.at : this.t;
    it.last = -1;
    this.items.push(it);
    if (!o.par) this.t = it.t0 + it.dur;
    it.update(0);
    return it;
  }
  path(d, o = {}) {
    const w = o.w ?? 5, color = o.color ?? INK;
    const sd = o.raw ? d : sketch(d, o.amp ?? 1.6);
    const el = $('path', { d: sd, fill: 'none', stroke: color, 'stroke-width': w,
                           'stroke-linecap': o.cap ?? 'round', 'stroke-linejoin': 'round' }, o.back ? this.back : this.main);
    if (o.opacity != null) el.setAttribute('stroke-opacity', o.opacity);
    let fillEl = null;
    if (o.fill) fillEl = $('path', { d: o.fillD ?? (o.raw ? d : sketch(d, .8)), fill: o.fill, opacity: 0 }, this.back);
    const len = el.getTotalLength() + 2;
    let target = el, maskEl = null, maskId = null;
    if (o.dash) {
      el.setAttribute('stroke-dasharray', o.dash);
      maskId = 'm' + (uid++);
      const m = $('mask', { id: maskId, maskUnits: 'userSpaceOnUse', x: -6000, y: -6000, width: 16000, height: 16000 }, defs);
      maskEl = target = $('path', { d: sd, fill: 'none', stroke: '#fff', 'stroke-width': w + 8, 'stroke-linecap': 'round' }, m);
    }
    target.setAttribute('stroke-dasharray', `${len} ${len}`);
    const inst = this.instant;
    const dur = inst ? .01 : (o.dur ?? clamp(len / (o.speed ?? 1500), o.min ?? .14, 1.5)) * DRAW;
    const it = {
      el, fillEl, dur, color, pen: !inst && o.pen !== false, penEl: el,
      update: p => {
        target.style.strokeDashoffset = len * (1 - p);
        el.style.visibility = p > 0 ? 'visible' : 'hidden';
        if (maskEl) { if (p >= 1) el.removeAttribute('mask'); else el.setAttribute('mask', `url(#${maskId})`); }
      },
      point: p => el.getPointAtLength(clamp(p) * (len - 2)),
    };
    this.add(it, o);
    if (fillEl) {
      const fo = o.fillOpacity ?? 1;
      this.add({ dur: inst ? .01 : .45, pen: false, update: p => fillEl.setAttribute('opacity', easeOut(p) * fo) }, { par: true });
    }
    return it;
  }
  fillOnly(d, color, o = {}) {      // a soft wash of colour, no pen
    const el = $('path', { d, fill: color, opacity: 0 }, o.front ? this.main : this.back);
    const fo = o.opacity ?? 1;
    return this.add({ el, dur: o.dur ?? .35, pen: false, update: p => el.setAttribute('opacity', easeOut(p) * fo) }, { par: o.par ?? true, at: o.at });
  }
  text(str, x, y, o = {}) {
    const hand = o.font === 'hand';
    const size = o.size ?? (hand ? 64 : 42);
    const el = $('text', { x, y, 'font-family': hand ? 'Caveat, cursive' : 'Kalam, cursive', 'font-size': size,
                           'font-weight': o.weight ?? (hand ? 700 : 400), fill: o.color ?? INK,
                           'text-anchor': o.anchor ?? 'start' }, o.back ? this.back : this.main);
    if (o.opacity != null) el.setAttribute('opacity', o.opacity);
    el.textContent = str;
    const bb = el.getBBox();
    const id = 'c' + (uid++);
    const cp = $('clipPath', { id, clipPathUnits: 'userSpaceOnUse' }, defs);
    const r = $('rect', { x: bb.x - 14, y: bb.y - 40, height: bb.height + 80, width: 0 }, cp);
    const inst = this.instant;
    const dur = inst ? .01 : (o.dur ?? clamp(str.length * (o.cps ?? .033), .3, 1.7)) * DRAW;
    const it = {
      el, bb, dur, color: o.color ?? INK, pen: !inst && o.pen !== false, penEl: el,
      update: p => {
        if (p >= 1) el.removeAttribute('clip-path');
        else { el.setAttribute('clip-path', `url(#${id})`); r.setAttribute('width', (bb.width + 28) * p); }
        el.style.visibility = p > 0 ? 'visible' : 'hidden';
      },
      point: p => ({ x: bb.x + bb.width * clamp(p), y: bb.y + bb.height * (.66 + .16 * Math.sin(p * bb.width / 8)) }),
    };
    return this.add(it, o);
  }
  hl(x, y, w, h, o = {}) {        // highlighter swipe, sits behind the ink
    return this.path(`M${x} ${y + h / 2 + 3}L${x + w} ${y + h / 2 - 3}`,
      { w: h, color: o.color ?? YEL, opacity: o.opacity ?? .55, cap: 'butt', back: true, raw: true, speed: 2600, ...o });
  }
  arrow(x1, y1, x2, y2, o = {}) {
    const bend = o.bend ?? 0, mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const dx = x2 - x1, dy = y2 - y1, dl = Math.hypot(dx, dy) || 1;
    const cx = mx - dy / dl * bend, cy = my + dx / dl * bend;
    const shaft = this.path(`M${x1} ${y1}Q${cx} ${cy} ${x2} ${y2}`, { w: 5, ...o });
    const ax = x2 - cx, ay = y2 - cy, al = Math.hypot(ax, ay) || 1, ux = ax / al, uy = ay / al, hl = o.head ?? 24, sp = .48;
    const p1 = [x2 - hl * (ux * Math.cos(sp) - uy * Math.sin(sp)), y2 - hl * (uy * Math.cos(sp) + ux * Math.sin(sp))];
    const p2 = [x2 - hl * (ux * Math.cos(-sp) - uy * Math.sin(-sp)), y2 - hl * (uy * Math.cos(-sp) + ux * Math.sin(-sp))];
    this.path(L(p1[0], p1[1], x2, y2, p2[0], p2[1]), { w: 5, amp: .6, min: .1, ...o, dash: null });
    return shaft;
  }
  fx(update, o = {}) { return this.add({ dur: o.dur ?? .5, pen: false, update }, o); }
  loop(fn, o = {}) { this.loops.push({ t0: o.at ?? this.t, fn }); fn(-1); }
  fade(els, to, o = {}) {
    const list = [].concat(els);
    return this.fx(p => list.forEach(e => e.style.opacity = lerp(1, to, ease(p))), { dur: .6, ...o });
  }
  pop(g, cx, cy, o = {}) {
    return this.fx(p => {
      g.setAttribute('transform', `translate(${cx} ${cy}) scale(${Math.max(.001, backOut(p))}) translate(${-cx} ${-cy})`);
      g.style.opacity = p > 0 ? 1 : 0;
    }, { dur: .45, ...o });
  }
  group(attrs, fn) {
    const g = $('g', attrs, this.main), ob = this.back, om = this.main;
    this.back = $('g', {}, g); this.main = $('g', {}, g);
    fn(g);
    this.back = ob; this.main = om;
    return g;
  }
  instantly(fn) { const was = this.instant; this.instant = true; fn(); this.instant = was; }
}

/* ---------- reusable drawings ---------- */
function grandpa(s, o = {}) {           // head centre at (0,0), about 260 x 380
  const q = { speed: 2000, min: .07 };
  s.path(E(0, 0, 62, 70), { ...q, w: 5, fill: SKIN });
  s.path('M-61 -10Q-82 -12 -78 10Q-75 28 -58 22', q);
  s.path('M61 -10Q82 -12 78 10Q75 28 58 22', q);
  s.path('M-58 -24Q-74 -42 -60 -56', { ...q, color: GREY, w: 6 });
  s.path('M-48 -40Q-60 -62 -40 -66', { ...q, color: GREY, w: 6 });
  s.path('M58 -24Q74 -42 60 -56', { ...q, color: GREY, w: 6 });
  s.path('M48 -40Q60 -62 40 -66', { ...q, color: GREY, w: 6 });
  s.path('M-22 -52Q-6 -60 10 -56', { ...q, color: '#fff', w: 6, opacity: .9 });
  s.path('M-44 -30Q-28 -40 -11 -32', { ...q, color: GREY, w: 7 });
  s.path('M11 -32Q28 -40 44 -30', { ...q, color: GREY, w: 7 });
  s.path(E(-25, -4, 18, 16), { ...q, w: 4 });
  s.path(E(25, -4, 18, 16), { ...q, w: 4 });
  s.path('M-7 -7Q0 -13 7 -7', { ...q, w: 4 });
  s.path(E(-25, -2, 4.5), { ...q, w: 3, fill: INK, pen: false, dur: .05, raw: true });
  s.path(E(25, -2, 4.5), { ...q, w: 3, fill: INK, pen: false, dur: .05, raw: true });
  s.path('M0 0Q-9 18 3 22', { ...q, w: 4 });
  s.path('M-36 36Q-18 24 0 33Q18 24 36 36Q18 46 0 39Q-18 46 -36 36Z', { ...q, w: 4, fill: '#dedede' });
  if (o.mouth === 'smile') s.path('M-18 52Q0 64 18 52', q);
  if (o.mouth === 'flat') s.path('M-15 55Q0 53 15 55', q);
  if (o.mouth === 'worried') s.path('M-16 58Q0 48 16 58', q);
  s.path('M-20 66L-22 88', q); s.path('M20 66L22 88', q);
  s.path('M-140 310Q-138 132 -32 92L0 132L32 92Q138 132 140 310', { ...q, w: 5, fill: SAGE,
         fillD: 'M-140 310Q-138 132 -32 92L0 132L32 92Q138 132 140 310Z' });
  s.path('M0 132L0 310', q);
  s.path('M-96 170Q-92 240 -88 310', q); s.path('M96 170Q92 240 88 310', q);
  [175, 225, 275].forEach(y => s.path(E(14, y, 5), { ...q, w: 3, fill: INK, pen: false, dur: .05, raw: true }));
}
function sarah(s, o = {}) {             // head centre at (0,0)
  const q = { speed: 2000, min: .07 };
  s.path('M-64 30Q-80 -84 0 -84Q80 -84 64 30Q68 96 46 106L-46 106Q-68 96 -64 30Z', { ...q, w: 5, fill: BROWN, fillOpacity: .85 });
  s.path(E(0, 2, 52, 62), { ...q, fill: SKIN });
  s.path('M-50 -18Q-8 -14 26 -60', { ...q, color: BROWN, w: 6 });
  s.path(E(-19, 4, 5), { ...q, w: 3, fill: INK, pen: false, dur: .05, raw: true });
  s.path(E(19, 4, 5), { ...q, w: 3, fill: INK, pen: false, dur: .05, raw: true });
  s.path('M-16 34Q0 48 16 34', q);
  s.path(E(-32, 24, 8, 5), { raw: true, w: 0, fill: CORAL, pen: false, dur: .05, fillOpacity: .7 });
  s.path(E(32, 24, 8, 5), { raw: true, w: 0, fill: CORAL, pen: false, dur: .05, fillOpacity: .7 });
  s.path('M-120 290Q-112 140 -24 110Q0 126 24 110Q112 140 120 290', { ...q, fill: CORAL,
         fillD: 'M-120 290Q-112 140 -24 110Q0 126 24 110Q112 140 120 290Z' });
}
function bandIcon(s, cx, cy, k = 1) {
  const q = { speed: 1800, min: .08 };
  s.path(R(cx - 50 * k, cy - 95 * k, 100 * k, 190 * k, 26 * k), { ...q, fill: DARK });
  s.path(R(cx - 38 * k, cy - 52 * k, 76 * k, 104 * k, 18 * k), { ...q, fill: '#1b1e25' });
  s.path(E(cx, cy, 10 * k), { raw: true, w: 3, color: BLUE, fill: BLUE, pen: false, dur: .1 });
}
function glow(s, cx, cy, o = {}) {      // pulsing rings around the band light
  const rings = [0, 1, 2].map(() => $('circle', { cx, cy, r: 10, fill: 'none', stroke: o.color ?? BLUE, 'stroke-width': 4, opacity: 0 }, s.main));
  s.loop(e => rings.forEach((c, i) => {
    if (e < 0) { c.setAttribute('opacity', 0); return; }
    const ph = (e * .7 + i / 3) % 1;
    c.setAttribute('r', (o.r0 ?? 14) + ph * (o.spread ?? 60));
    c.setAttribute('opacity', ((1 - ph) * .7 * Math.min(1, e * 2)).toFixed(3));
  }), o);
}
function keyIcon(s, x, y, k = 1, color = INK) {

/* ============================================================
   Engine: build, camera, pen, playback
   ============================================================ */
const PAN = 1.4, HOLD = 1.8;
let idx = 0, clock = 0, playing = true, captions = true;
let cam = { x: 0, y: 0, z: 1 }, from = null;

function buildAll() {
  SCENES.forEach(sc => {
    sc.pan = sc.pan ?? PAN;
    sc.g = $('g', { transform: `translate(${sc.x - W / 2} ${sc.y - H / 2})` }, world);
    const b = new Builder(sc.g);
    sc.build(b);
    sc.items = b.items; sc.caps = b.caps; sc.loops = b.loops;
    const end = Math.max(...b.items.map(i => i.t0 + i.dur), 0);
    sc.content = end; sc.D = sc.pan + end + (sc.hold ?? HOLD);
    sc.penItems = sc.items.filter(i => i.pen).sort((a, b) => a.t0 - b.t0);
    sc.penItems.forEach(it => { it.p0 = it.point(0); it.p1 = it.point(1); });
    sc.state = 'empty';
  });
}
function target(sc) { const c = sc.cam ? sc.cam[0] : { x: sc.x, y: sc.y, z: sc.z ?? 1 }; return { x: c.x, y: c.y, z: c.z }; }
function camAt(sc, tl) {
  const to = target(sc);
  if (tl < sc.pan) {
    const e = ease(clamp(tl / sc.pan));
    const f = from ?? to, dip = Math.hypot(f.x - to.x, f.y - to.y) > 10 ? .16 : 0;
    return { x: lerp(f.x, to.x, e), y: lerp(f.y, to.y, e), z: lerp(f.z, to.z, e) * (1 - dip * Math.sin(Math.PI * e)) };
  }
  const lt = tl - sc.pan;
  if (sc.cam) {
    const k = sc.cam; let i = 0;
    while (i < k.length - 1 && lt > k[i + 1].t) i++;
    if (i === k.length - 1) return { ...k[i] };
    const e = ease(clamp((lt - k[i].t) / (k[i + 1].t - k[i].t)));
    const z = Math.exp(lerp(Math.log(k[i].z), Math.log(k[i + 1].z), e));
    return { x: lerp(k[i].x, k[i + 1].x, e), y: lerp(k[i].y, k[i + 1].y, e), z };
  }
  const u = clamp(lt / Math.max(1, sc.D - sc.pan));
  return { x: to.x, y: to.y, z: to.z * (1 + .022 * u) };
}

/* the marker: tip at (0,0), body toward the lower right */
const pen = (() => {
  const shadow = $('g', { filter: 'url(#penShadow)', opacity: .28 }, penG);
  const body = $('g', {}, penG);
  const shape = g => {
    const r = $('g', { transform: 'rotate(42)' }, g);
    return {
      tip: $('path', { d: 'M0 0L24 -8L24 8Z', fill: INK }, r),
      cone: $('path', { d: 'M24 -10L50 -17L50 17L24 10Z', fill: '#d8d8d8', stroke: INK, 'stroke-width': 3, 'stroke-linejoin': 'round' }, r),
      barrel: $('rect', { x: 50, y: -18, width: 210, height: 36, rx: 7, fill: '#f7f7f5', stroke: INK, 'stroke-width': 3 }, r),
      stripe: $('rect', { x: 66, y: -18, width: 22, height: 36, fill: INK }, r),
      label: $('path', { d: 'M110 -6H210M110 6H180', stroke: '#c9c9c9', 'stroke-width': 4, 'stroke-linecap': 'round' }, r),
      cap: $('rect', { x: 256, y: -19, width: 56, height: 38, rx: 11, fill: INK, stroke: INK, 'stroke-width': 3 }, r),
    };
  };
  shape(shadow); const p = shape(body);
  Object.values(shadow.querySelectorAll('*')).forEach(e => { if (e.tagName !== 'g') { e.setAttribute('fill', '#000'); e.setAttribute('stroke', '#000'); } });
  let lastColor = null;
  return {
    set(x, y, down, color, t) {
      const lift = down ? 0 : 1, wob = Math.sin(t * 7) * 1.5;
      body.setAttribute('transform', `translate(${(x - lift * 6).toFixed(1)} ${(y - lift * 10).toFixed(1)}) rotate(${wob.toFixed(2)})`);
      shadow.setAttribute('transform', `translate(${(x + 18 + lift * 16).toFixed(1)} ${(y + 22 + lift * 24).toFixed(1)}) rotate(${wob.toFixed(2)})`);
      if (color && color !== lastColor) { lastColor = color; ['tip', 'stripe', 'cap'].forEach(k => { p[k].setAttribute('fill', color); }); p.cap.setAttribute('stroke', INK); }
    },
  };
})();

function toStage(el, pt) { const m = el.getCTM(); return { x: m.a * pt.x + m.c * pt.y + m.e, y: m.b * pt.x + m.d * pt.y + m.f }; }
const OFF = { x: W + 320, y: H + 260 };
function updatePen(sc, lt, realT) {
  let active = null, prev = null, next = null;
  for (const it of sc.penItems) {
    if (it.t0 <= lt && lt < it.t0 + it.dur) active = it;
    if (it.t0 + it.dur <= lt && (!prev || it.t0 + it.dur >= prev.t0 + prev.dur)) prev = it;
    if (it.t0 > lt && (!next || it.t0 < next.t0)) next = it;
  }
  if (active) {
    const pt = toStage(active.penEl, active.point((lt - active.t0) / active.dur));
    return pen.set(pt.x, pt.y, true, active.color, realT);
  }
  const a = prev ? toStage(prev.penEl, prev.p1) : OFF;
  if (next) {
    const gapStart = prev ? prev.t0 + prev.dur : -sc.pan;
    const travel = Math.min(.5, next.t0 - gapStart);
    const k = ease(clamp((lt - (next.t0 - travel)) / travel));
    const b = toStage(next.penEl, next.p0);
    return pen.set(lerp(a.x, b.x, k), lerp(a.y, b.y, k), false, k > .5 ? next.color : (prev ? prev.color : next.color), realT);
  }
  const k = ease(clamp((lt - (prev ? prev.t0 + prev.dur : 0)) / 1.0));
  pen.set(lerp(a.x, OFF.x, k), lerp(a.y, OFF.y, k), false, prev ? prev.color : INK, realT);
}

let lastCap = null;
function render(realT) {
  const sc = SCENES[idx], lt = clock - sc.pan;
  let c = camAt(sc, clock);
  if (shake.v > 0) { c = { ...c, x: c.x + Math.sin(realT * 90) * 9 * shake.v, y: c.y + Math.cos(realT * 70) * 6 * shake.v }; }
  cam = c;
  world.setAttribute('transform', `translate(${W / 2} ${H / 2}) scale(${c.z.toFixed(5)}) translate(${(-c.x).toFixed(2)} ${(-c.y).toFixed(2)})`);
  stage.style.backgroundPosition = `${(W / 2 - c.x * c.z).toFixed(1)}px ${(H / 2 - c.y * c.z).toFixed(1)}px`;
  stage.style.backgroundSize = `${(512 * c.z).toFixed(1)}px`;
  SCENES.forEach((s, j) => {
    const want = j < idx ? 'full' : j > idx ? 'empty' : 'live';
    const t = j < idx ? 1e9 : j > idx ? -1e9 : lt;
    if (want === 'live' || s.state !== want) {
      for (const it of s.items) { const p = clamp((t - it.t0) / it.dur); if (p !== it.last) { it.last = p; it.update(p); } }
      s.state = want;
    }
    for (const l of s.loops) l.fn(j < idx ? 60 + realT : j > idx ? -1 : (t - l.t0 >= 0 ? t - l.t0 : -1));
  });
  updatePen(sc, lt, realT);
  let cap = '';
  for (const k of sc.caps) if (k.t <= lt) cap = k.text;
  if (cap !== lastCap) {
    lastCap = cap;
    if (cap) { capEl.textContent = cap; capEl.classList.add('on'); } else capEl.classList.remove('on');
  }
  const before = SCENES.slice(0, idx).reduce((a, s) => a + s.D, 0), total = SCENES.reduce((a, s) => a + s.D, 0);
  document.getElementById('prog').style.width = ((before + clock) / total * 100).toFixed(2) + '%';
  const tt = before + clock, fmt = v => `${Math.floor(v / 60)}:${String(Math.floor(v % 60)).padStart(2, '0')}`;
  document.getElementById('tc').textContent = `${fmt(tt)} / ${fmt(total)}`;
}

function goto(n, o = {}) {
  n = clamp(n, 0, SCENES.length - 1);
  from = o.instant ? null : { ...cam };
  idx = n; clock = o.t ?? 0;
  if (o.instant) from = target(SCENES[n]);
  document.querySelectorAll('#dots button').forEach((b, i) => b.classList.toggle('cur', i === idx));
}
function setPlaying(v) { playing = v; document.getElementById('play').textContent = v ? 'pause' : 'play'; }

let lastNow = null;
function frame(now) {
  const realT = now / 1000;
  if (lastNow != null && playing) {
    clock += Math.min(.05, realT - lastNow);
    const sc = SCENES[idx];
    if (clock >= sc.D) {
      if (idx < SCENES.length - 1) { const over = clock - sc.D; goto(idx + 1); clock = over; }
      else { clock = sc.D; setPlaying(false); }
    }
  }
  lastNow = realT;
  render(realT);
  requestAnimationFrame(frame);
}

/* ---------- paper, fit, input ---------- */
function paper() {
  const cv = document.createElement('canvas'); cv.width = cv.height = 512;
  const c = cv.getContext('2d');
  c.fillStyle = '#fbf7ee'; c.fillRect(0, 0, 512, 512);
  const img = c.getImageData(0, 0, 512, 512), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - .5) * 13; d[i] += n; d[i + 1] += n; d[i + 2] += n * .9; }
  c.putImageData(img, 0, 0);
  for (let i = 0; i < 160; i++) {
    c.strokeStyle = Math.random() < .5 ? 'rgba(120,95,50,.05)' : 'rgba(255,255,255,.35)';
    c.lineWidth = .6 + Math.random();
    c.beginPath(); const x = Math.random() * 512, y = Math.random() * 512, a = Math.random() * 6.28, l = 6 + Math.random() * 22;
    c.moveTo(x, y); c.quadraticCurveTo(x + Math.cos(a + .6) * l / 2, y + Math.sin(a + .6) * l / 2, x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
  }
  stage.style.backgroundImage = `url(${cv.toDataURL()})`;
}
function fit() { const k = Math.min(innerWidth / W, innerHeight / H); stage.style.transform = `translate(-50%,-50%) scale(${k})`; }

function setupUI() {
  const dots = document.getElementById('dots');
  SCENES.forEach((sc, i) => {
    const b = document.createElement('button'); b.textContent = i + 1; b.title = sc.name;
    b.onclick = () => { goto(i); setPlaying(true); }; dots.appendChild(b);
  });
  document.getElementById('play').onclick = () => setPlaying(!playing);
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown') { goto(idx + 1); setPlaying(true); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { goto(idx - 1); setPlaying(true); }
    else if (k === 'p' || k === 'k') setPlaying(!playing);
    else if (k === 'c') { captions = !captions; document.body.classList.toggle('nocaps', !captions); }
    else if (k === 'r') document.body.classList.toggle('record');
    else if (k === 'f') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); }
    else if (k === 'Home') { resetAll(); goto(0, { instant: true }); setPlaying(true); }
    else if (/^[0-9]$/.test(k)) { goto(k === '0' ? 9 : +k - 1); setPlaying(true); }
    else return;
    e.preventDefault();
  });
  addEventListener('resize', fit);
}
function resetAll() { SCENES.forEach(s => s.state = 'dirty'); }

async function start() {
  paper(); fit(); setupUI();
  try {
    await Promise.race([
      Promise.all(['700 40px Caveat', '500 40px Caveat', '400 40px Kalam', '700 40px Kalam'].map(f => document.fonts.load(f))),
      new Promise(r => setTimeout(r, 4000)),
    ]);
  } catch (_) {}
  buildAll();
  document.getElementById('loading').remove();
  const q = new URLSearchParams(location.search);
  if (q.get('captions') === '0') { captions = false; document.body.classList.add('nocaps'); }
  if (q.get('record') === '1') document.body.classList.add('record');
  const n = clamp((parseInt(q.get('scene') || '1', 10) || 1) - 1, 0, SCENES.length - 1);
  goto(n, { instant: true, t: parseFloat(q.get('t') || '0') || 0 });
  if (q.get('paused') === '1') setPlaying(false);
  window.KIN = {
    scenes: SCENES.map((s, i) => ({ n: i + 1, name: s.name, seconds: +s.D.toFixed(1) })),
    seek: (n, t) => { goto(n - 1, { instant: true, t }); setPlaying(false); render(performance.now() / 1000); },
    play: () => setPlaying(true),
  };
  requestAnimationFrame(frame);
}
start();
</script>
